; Sample 3DMigoto / XXMI INI used for the syntax-highlighting proof of concept.
namespace = SampleMod

[Constants]
global persist $swapvar = 0
global $active
global $costume = 1

[KeySwap]
condition = $active == 1
key = no_modifiers VK_DOWN
type = cycle
$swapvar = 0,1,2

[Present]
if $swapvar == 1
    $costume = 2
else if $swapvar == 2
    $costume = 3
endif

[TextureOverrideBodyPosition]
hash = 1a2b3c4d
match_priority = 10
if $costume == 1
    vb0 = ResourceBodyPosition
    ib = ResourceBodyIB
    handling = skip
    drawindexed = auto
endif

[ShaderOverrideCharacter]
hash = deadbeef12345678
allow_duplicate_hash = overrule
checktextureoverride = ps-t0

[ResourceBodyPosition]
type = Buffer
stride = 40
filename = Meshes/BodyPosition.buf

[ResourceBodyIB]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Meshes/Body.ib
