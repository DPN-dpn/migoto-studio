name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ hashFiles('src-tauri/icons/icon.ico') }}

      - name: Cache Tauri NSIS / Build Tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\tauri
            ~/.cache/tauri
          key: ${{ runner.os }}-tauri-tools-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-tools-

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag name
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Synchronize version files with release tag
        run: node scripts/bump-version.mjs ${{ steps.vars.outputs.tag }}

      - name: Generate Release Notes
        id: notes
        run: node scripts/generate-release-notes.mjs ${{ steps.vars.outputs.tag }}

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'Migoto Studio ${{ steps.vars.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Create Portable Package
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.tag }}"
          $dirName = "Migoto-Studio_${ver}_portable-x64"
          New-Item -ItemType Directory -Force -Path $dirName | Out-Null
          
          # Locate built binary
          if (Test-Path "src-tauri\target\release\app.exe") {
            Copy-Item "src-tauri\target\release\app.exe" "$dirName\Migoto Studio.exe"
          } elseif (Test-Path "src-tauri\target\release\Migoto Studio.exe") {
            Copy-Item "src-tauri\target\release\Migoto Studio.exe" "$dirName\Migoto Studio.exe"
          }
          
          # Portable mode marker
          New-Item -ItemType File -Force -Path "$dirName\portable.txt" | Out-Null
          
          $zipName = "$dirName.zip"
          Compress-Archive -Path "$dirName\*" -DestinationPath $zipName -Force
          Write-Output "Created portable archive: $zipName"

      - name: Upload Portable Package to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: Migoto-Studio_*_portable-x64.zip
