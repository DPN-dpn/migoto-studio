name: Update Release Notes

on:
  push:
    paths:
      - 'release-notes.md'
      - '.github/workflows/update-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update GitHub Release Body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api /repos/DPN-dpn/migoto-studio/releases/tags/v0.9.2 --jq .id)
          echo "Found Release ID: $RELEASE_ID"
          gh api --method PATCH "/repos/DPN-dpn/migoto-studio/releases/$RELEASE_ID" -F body=@release-notes.md
          echo "Updated Release Body:"
          gh api "/repos/DPN-dpn/migoto-studio/releases/$RELEASE_ID" --jq .body
