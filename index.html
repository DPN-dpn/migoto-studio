<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Migoto Studio - XXMI/3DMigoto INI 에디터" />
    <meta name="theme-color" content="#252526" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Migoto Studio</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <h1 id="app-title">Migoto Studio</h1>
        <nav id="toolbar" aria-label="도구">
          <button id="btn-new" title="새 파일 (Ctrl+N)">새 파일</button>
          <button id="btn-open" title="파일 열기 (Ctrl+O)">열기</button>
          <button id="btn-open-folder" title="모드 폴더 열기">폴더 열기</button>
          <button id="btn-recent" title="최근 파일">최근 ▾</button>
          <button id="btn-save" class="primary" title="저장 (Ctrl+S)">저장</button>
          <button id="btn-saveas" title="다른 이름으로 저장 (Ctrl+Shift+S)">다른 이름으로</button>
          <span class="divider"></span>
          <button id="btn-insert" title="자주 쓰는 블록을 커서 위치에 넣기">삽입 ▾</button>
          <button id="btn-restore" title="이전에 저장한 내용으로 되돌리기">백업 복원</button>
          <span class="spacer"></span>
          <button id="btn-outline" class="icon-btn" aria-pressed="true" aria-label="사이드바" title="사이드바 (탐색기/섹션) 보이기/숨기기">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="9.5" y1="4" x2="9.5" y2="20"/>
              <line x1="5.8" y1="9" x2="7.4" y2="9"/><line x1="5.8" y1="12" x2="7.4" y2="12"/><line x1="5.8" y1="15" x2="7.4" y2="15"/>
            </svg>
          </button>
          <button id="btn-minimap" class="icon-btn" aria-pressed="true" aria-label="미니맵" title="미니맵 보이기/숨기기">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="14.5" y1="4" x2="14.5" y2="20"/>
              <line x1="6" y1="9" x2="11.5" y2="9"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="6" y1="15" x2="11" y2="15"/>
              <rect x="16.4" y="6.5" width="2.6" height="4" rx="0.6" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <button id="btn-settings" title="설정 (Ctrl+,)">설정</button>
          <button id="btn-help" class="icon-btn" aria-label="도움말 및 정보" title="도움말 및 정보 (F1)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9.5"/>
              <path d="M9.5 9.2a2.5 2.5 0 0 1 4.5 1.4c0 1.5-2 2-2 2"/>
              <circle cx="12" cy="16.5" r="0.7" fill="currentColor"/>
            </svg>
          </button>
          <button id="btn-pwa-install" class="pwa-install-btn" title="이 기기에 앱으로 설치" hidden>앱 설치</button>
        </nav>
        <span id="file-name">이름 없음</span>
      </header>
      <div id="workspace">
        <aside id="sidebar" aria-label="사이드바">
          <div class="sidebar-tabs" role="tablist" aria-label="사이드바 탭">
            <button id="sidebar-tab-explorer" class="sidebar-tab active" role="tab" aria-selected="true" title="모드 파일 탐색기">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>탐색기</span>
            </button>
            <button id="sidebar-tab-outline" class="sidebar-tab" role="tab" aria-selected="false" title="섹션 목록">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
              <span>섹션 목록</span>
            </button>
          </div>
          <div id="sidebar-panel-explorer" class="sidebar-panel active"></div>
          <div id="sidebar-panel-outline" class="sidebar-panel" hidden></div>
        </aside>
        <div id="sidebar-resizer" class="resizer" role="separator" aria-orientation="vertical" title="드래그하여 섹션 목록 너비 조절 (더블 클릭 시 기본값으로 초기화)"></div>
        <div id="editor-container">
          <div id="tabbar-container">
            <div id="tabbar" role="tablist" aria-label="열린 파일 탭"></div>
            <button id="btn-new-tab" class="tab-action-btn" title="새 파일 탭 (Ctrl+N)" aria-label="새 탭">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
          <main id="editor"></main>
        </div>
      </div>
      <footer id="statusbar">
        <span class="status-left">
          <span id="status-pos">줄 1, 열 1</span>
          <button id="status-lint" class="status-btn" title="오류/경고 위치로 이동">✓ 문제 없음</button>
        </span>
        <span class="status-right">
          <button id="status-eol" class="status-btn" title="줄바꿈 방식 전환 (CRLF/LF)">CRLF</button>
          <select id="status-encoding" class="status-btn" title="저장할 인코딩"></select>
          <span id="status-grammar">문법: -</span>
        </span>
      </footer>
      <ul id="recent-menu" class="popup-menu" hidden></ul>
      <ul id="insert-menu" class="popup-menu" hidden></ul>
      <ul id="tab-menu" class="popup-menu" hidden></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
