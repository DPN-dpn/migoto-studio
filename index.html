<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Migoto Studio - XXMI/3DMigoto INI 에디터" />
    <meta name="theme-color" content="#252526" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Migoto Studio</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="titlebar-left">
          <div id="app-brand">
            <img id="app-logo" src="./icon-192.png" alt="Migoto Studio Logo" width="18" height="18" />
            <h1 id="app-title">Migoto Studio</h1>
          </div>
          <nav id="menubar" role="menubar" aria-label="메인 메뉴"></nav>
        </div>
        <div class="titlebar-center">
          <span id="file-name">이름 없음</span>
        </div>
        <div class="titlebar-right">
          <button id="btn-pwa-install" class="pwa-install-btn" title="이 기기에 앱으로 설치" hidden>앱 설치</button>
          <span id="app-version-badge" class="app-version-badge" title="Migoto Studio 버전 (클릭 시 도움말)">v0.7.0</span>
        </div>
      </header>
      <div id="workspace">
        <nav id="activity-bar" aria-label="사이드바 세로 도구 모음">
          <div class="activity-bar-top">
            <button id="act-explorer" class="activity-bar-btn active" title="모드 파일 탐색기 (Ctrl+Shift+E)" aria-label="탐색기">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <button id="act-outline" class="activity-bar-btn" title="섹션 개요 목록" aria-label="섹션 목록">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </button>
            <button id="act-templates" class="activity-bar-btn" title="코드 템플릿 및 스니펫" aria-label="템플릿">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
              </svg>
            </button>
            <button id="act-plugins" class="activity-bar-btn" title="플러그인 및 확장 도구" aria-label="플러그인">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8a2.5 2.5 0 0 1 0 5V19a2 2 0 0 0 2 2h4v-1.5a2.5 2.5 0 0 1 5 0V21h4a2 2 0 0 0 2-2v-4a2.5 2.5 0 0 1 3.5-2.3 2.5 2.5 0 0 0 0-1.7z"></path>
              </svg>
            </button>
            <div id="act-plugins-separator" class="activity-bar-separator" hidden></div>
            <div id="act-plugins-custom" class="activity-bar-custom-plugins"></div>
          </div>
          <div class="activity-bar-bottom">
            <button id="act-settings" class="activity-bar-btn" title="환경설정 (Ctrl+,)" aria-label="설정">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
          </div>
        </nav>
        <aside id="sidebar" aria-label="사이드바">
          <div id="sidebar-panel-explorer" class="sidebar-panel active"></div>
          <div id="sidebar-panel-outline" class="sidebar-panel" hidden></div>
          <div id="sidebar-panel-templates" class="sidebar-panel" hidden></div>
          <div id="sidebar-panel-plugins" class="sidebar-panel" hidden></div>
        </aside>
        <div id="sidebar-resizer" class="resizer" role="separator" aria-orientation="vertical" title="드래그하여 사이드바 너비 조절 (더블 클릭 시 기본값으로 초기화)"></div>
        <div id="editor-container">
          <div id="tabbar-container">
            <div id="tabbar" role="tablist" aria-label="열린 파일 탭"></div>
            <button id="btn-new-tab" class="tab-action-btn" title="새 파일 탭 (Ctrl+N)" aria-label="새 탭">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
          <main id="editor"></main>
          <div id="custom-viewer-container" class="custom-viewer-panel" hidden></div>
          <div id="diff-container" class="diff-container-panel" hidden></div>
        </div>
      </div>
      <footer id="statusbar">
        <span class="status-left">
          <span id="status-pos">줄 1, 열 1</span>
          <button id="status-lint" class="status-btn" title="오류/경고 위치로 이동">✓ 문제 없음</button>
        </span>
        <span class="status-right">
          <button id="status-eol" class="status-btn" title="줄바꿈 방식 전환 (CRLF/LF)">CRLF</button>
          <select id="status-encoding" class="status-btn" title="저장할 인코딩"></select>
          <span id="status-grammar">문법: -</span>
        </span>
      </footer>
      <ul id="tab-menu" class="popup-menu" hidden></ul>
      <ul id="explorer-menu" class="popup-menu" hidden></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
